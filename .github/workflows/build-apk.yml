name: Build RIE Bhopal Library APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Find and Build with Gradle Wrapper
        shell: bash
        run: |
          # रेपो में gradlew फ़ाइल ढूँढें
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW_FILE" ]; then
            echo "Error: gradlew फ़ाइल पूरे रिपॉजिटरी में कहीं नहीं मिली!"
            echo "फ़ोल्डर लिस्टिंग:"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "Found gradlew at: $GRADLEW_FILE"
          echo "Entering project directory: $PROJECT_DIR"

          chmod +x "$GRADLEW_FILE"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        shell: bash
        run: |
          APK_FILE=$(find . -name "*debug*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "APK फ़ाइल नहीं मिली!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rie-bhopal-library-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RIE Bhopal Library v1.0.${{ github.run_number }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: false
          fail_on_unmatched_files: true
